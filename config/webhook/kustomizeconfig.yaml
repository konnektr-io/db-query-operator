# This configuration teaches kustomize how to rewrite the Service reference of
# the ValidatingWebhookConfiguration when the namespace and name prefixes are
# applied by the parent kustomization.
nameReference:
- kind: Service
  version: v1
  fieldSpecs:
  - kind: ValidatingWebhookConfiguration
    group: admissionregistration.k8s.io
    path: webhooks/clientConfig/service/name

namespace:
- kind: ValidatingWebhookConfiguration
  group: admissionregistration.k8s.io
  path: webhooks/clientConfig/service/namespace
  create: true
